<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0b0712" stroke="#d4a853" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Outer decorative ring segments -->
  <circle cx="32" cy="32" r="27" stroke="#d4a853" stroke-width="0.5" stroke-dasharray="6 3" opacity="0.4"/>

  <!-- Key body - vertical shaft -->
  <rect x="30.5" y="22" width="3" height="18" rx="1.5" fill="#d4a853"/>

  <!-- Key bow (top circle) -->
  <circle cx="32" cy="18" r="7" stroke="#d4a853" stroke-width="2.5" fill="none"/>
  <!-- Inner circle of key bow -->
  <circle cx="32" cy="18" r="3.5" fill="#9f5de2" opacity="0.8"/>

  <!-- Key teeth (right side) -->
  <rect x="33.5" y="33" width="3.5" height="2" rx="0.5" fill="#d4a853"/>
  <rect x="33.5" y="37" width="2.5" height="2" rx="0.5" fill="#d4a853"/>

  <!-- Corner runes (decorative dots) -->
  <circle cx="18" cy="18" r="1.5" fill="#9f5de2" opacity="0.6"/>
  <circle cx="46" cy="18" r="1.5" fill="#9f5de2" opacity="0.6"/>
  <circle cx="18" cy="46" r="1.5" fill="#9f5de2" opacity="0.6"/>
  <circle cx="46" cy="46" r="1.5" fill="#9f5de2" opacity="0.6"/>

  <!-- Subtle glow effect center dot -->
  <circle cx="32" cy="18" r="1.5" fill="#f0c878"/>
</svg>